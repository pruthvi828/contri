name: Daily Safe Activity Sync

on:
  schedule:
    # Runs once daily at 14:15 UTC (~7:45 PM IST)
    - cron: '15 14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

permissions:
  contents: write

jobs:
  commit-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configure Git Identity
        run: |
          git config --global user.name "spidyy19"
          git config --global user.email "jadhavpruthvi828@gmail.com"

      - name: Execute Daily Varied Activity
        run: |
          python script.py --daily
